<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grade Calculator</title>

  <!-- link to our separate CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Student Grade Calculator</h1>

    <!-- form for entering a student's scores -->
    <div class="card">

      <label for="studentName">Student Name</label>
      <input type="text" id="studentName" placeholder="Enter student name">

      <label for="score1">Assessment Score 1</label>
      <input type="number" id="score1" placeholder="Enter score">

      <label for="score2">Assessment Score 2</label>
      <input type="number" id="score2" placeholder="Enter score">

      <label for="score3">Assessment Score 3</label>
      <input type="number" id="score3" placeholder="Enter score">

      <button id="calculateBtn">Calculate Grade</button>

    </div>

    <!-- list of saved students shows up here -->
    <div class="card">
      <h2>Student Records</h2>
      <div id="records">
        <p class="empty">No student records yet.</p>
      </div>
    </div>

  </div>

  <!-- link to our separate JS file, placed at the bottom so the page loads first -->
  <script src="script.js"></script>
</body>
</html>
